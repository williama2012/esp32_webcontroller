profiles:
  esp32_webcontroller:
    fqbn: esp32:esp32:esp32:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
    libraries:
      - ArduinoJson (7.4.3)
      - UrlEncode (1.0.1)
      - Bonezegei_DHT11 (1.0.1)
      - LiquidCrystal_I2C (2.0.0)
      - incbin (0.1.2)
      - Adafruit NeoMatrix (1.3.3)
      - Adafruit NeoPixel (1.15.5)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
    programmer: ""
    port: COM3
    port_config:
      baudrate: "115200"
      bits: "8"
      parity: none
      stop_bits: one
default_profile: esp32_webcontroller
