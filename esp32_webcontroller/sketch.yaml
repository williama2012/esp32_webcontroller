profiles:
  esp32_webcontroller:
    fqbn: esp32:esp32:esp32:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
    libraries:
      - ArduinoJson (7.4.3)
      - UrlEncode (1.0.1)
      - Bonezegei_DHT22 (1.0.0)
    programmer: ""
    port: COM3
    port_config:
      baudrate: "115200"
      bits: "8"
      parity: none
      stop_bits: one
default_profile: esp32_webcontroller
